<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>家計簿アプリ</title>
</head>

<body>
    <h1>家計簿アプリへようこそ</h1>

    <form th:action="@{/register}" th:object="${expenseForm}" method="post">

        <div>
            <label for="expenseName">支出名</label>
            <input type="text" id="expenseName" th:field="*{expenseName}">

            <p th:if="${#fields.hasErrors('expenseName')}" th:errors="*{expenseName}" style="color:red;"></p>
        </div>

        <div>
            <label for="amount">金額</label>
            <input type="number" id="amount" th:field="*{amount}" min="1" required>

            <p th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" style="color:red;"></p>
        </div>

        <div>
            <label for="category">カテゴリ</label>

            <select id="category" th:field="*{category}" required>

                <option value="">選択してください</option>
                <option value="食費">食費</option>
                <option value="交通費">交通費</option>
                <option value="趣味">趣味</option>
                <option value="日用品">日用品</option>
                <option value="その他">その他</option>
            </select>

            <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color:red;"></p>
        </div>

        <div>
            <label for="expenseDate">支出日</label>
            <input type="date" id="expenseDate" th:field="*{expenseDate}" required>

            <p th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}" style="color:red;"></p>
        </div>

        <button type="submit">登録</button>
    </form>

    <hr>

    <h2>月間予算の設定</h2>

    <form action="/budget/register" method="post">
        <div>
            <label for="budgetMonth">対象月</label>
            <input type="month" id="budgetMonth" name="budgetMonth" th:value="${currentMonth}" required>
        </div>

        <div>
            <label for="budgetAmount">予算額</label>
            <input type="number" id="budgetAmount" name="amount" min="1" required>
        </div>

        <button type="submit">予算を保存</button>
    </form>
</body>

</html>
