<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>支出編集</title>
</head>

<body>
    <h1>支出編集</h1>

    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>

    <form th:action="@{/update}" method="post">

        <input type="hidden" name="id" th:value="${expense.id}">

        <div>
            <label for="expenseName">支出名</label>
            <input type="text" id="expenseName" name="expenseName"
                th:value="${errorMessage != null ? enteredExpenseName : expense.expenseName}" required>
        </div>

        <input type="number" id="amount" name="amount"
            th:value="${errorMessage != null ? enteredAmount : expense.amount}" min="1" required>

        <div>
            <label for="category">カテゴリ</label>

            <select id="category" name="category" required>
                <option value="" th:selected="${errorMessage != null ? enteredCategory == '' : false}">
                    選択してください
                </option>

                <option value="食費" th:selected="${errorMessage != null
                        ? enteredCategory == '食費'
                        : expense.category == '食費'}">
                    食費
                </option>

                <option value="交通費" th:selected="${errorMessage != null
                        ? enteredCategory == '交通費'
                        : expense.category == '交通費'}">
                    交通費
                </option>

                <option value="趣味" th:selected="${errorMessage != null
                        ? enteredCategory == '趣味'
                        : expense.category == '趣味'}">
                    趣味
                </option>

                <option value="日用品" th:selected="${errorMessage != null
                        ? enteredCategory == '日用品'
                        : expense.category == '日用品'}">
                    日用品
                </option>

                <option value="その他" th:selected="${errorMessage != null
                        ? enteredCategory == 'その他'
                        : expense.category == 'その他'}">
                    その他
                </option>
            </select>
        </div>

        <div>
            <label for="expenseDate">支出日</label>
            <input type="date" id="expenseDate" name="expenseDate"
                th:value="${errorMessage != null ? enteredExpenseDate : expense.expenseDate}" required>
        </div>

        <button type="submit">更新</button>
    </form>

    <a href="/">トップページに戻る</a>
</body>

</html>
